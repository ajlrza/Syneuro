[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "Syneuro"
version = "0.5.0"
requires-python = ">= 3.13"
dependencies = [
    "groq==1.4.0",
    "llvmlite==0.48.0",
    "numba==0.66.0",
    "numpy==2.4.6",
    "orjson==3.13.0",
]
authors = [
  {name = "Anjelo Laroza", email = "larozaanjelo@gmail.com"},
]
maintainers = [
  {name = "Anjelo Laroza", email = "larozaanjelo@gmail.com"}
]
description = "A Lightweight Groq-based Quantitative Emotion Layer for AI Chatbots."
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.hatch.build.targets.wheel]
packages = ["Syneuro"]